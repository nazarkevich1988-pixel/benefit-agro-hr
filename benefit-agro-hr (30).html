        <div>
          {/* Period */}
          <div className="card" style={{marginBottom:12}}>
            <div className="card-header"><span className="card-title">📅 Звітний період</span></div>
            <div style={{padding:'16px 20px', display:'flex', gap:16, flexWrap:'wrap', alignItems:'center'}}>
              <div className="form-group" style={{marginBottom:0}}>
                <label>Місяць</label>
                <select value={period.month} onChange={e=>setPeriod(p=>({...p,month:parseInt(e.target.value)}))}>
                  {MONTHS.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
                </select>
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                <label>Рік</label>
                <select value={period.year} onChange={e=>setPeriod(p=>({...p,year:parseInt(e.target.value)}))}>
                  {[2024,2025,2026].map(y=><option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                <label>Дата заповнення</label>
                <input type="date" value={fillDate} onChange={e=>setFillDate(e.target.value)}/>
              </div>
            </div>
          </div>

          {/* Employees salaries */}
          <div className="card" style={{marginBottom:12}}>
            <div className="card-header"><span className="card-title">👤 Зарплата штатних працівників (ознака 101)</span></div>
            <div style={{padding:'16px 20px'}}>
              <table>
                <thead><tr>
                  <th>ПІБ</th><th style={{width:140}}>ІПН</th>
                  <th style={{width:160}}>Нарахована сума, грн</th>
                  <th style={{width:120}}>Тип нарахування</th>
                  <th style={{width:100}}>ПДФО 18%</th>
                  <th style={{width:90}}>ВЗ 5%</th>
                  <th style={{width:90}}>ЄСВ 22%</th>
                </tr></thead>
                <tbody>
                  {activeEmps.map(e=>{
                    const sal = parseFloat(salaries[e.id]||0);
                    const hireDateStr = e.hireDate || '';
                    const hireDateSafe = hireDateStr ? (hireDateStr.includes('T') ? hireDateStr : hireDateStr+'T12:00:00') : null;
                    const hireDate = hireDateSafe ? new Date(hireDateSafe) : null;
                    const periodEnd = new Date(period.year, period.month, 0, 23, 59, 59);
                    const periodStart = new Date(period.year, period.month-1, 1);
                    const inPeriod = !hireDate || hireDate <= periodEnd;
                    return (
                      <tr key={e.id} style={{opacity: inPeriod ? 1 : 0.5}}>
                        <td style={{fontWeight:500}}>
                          {e.lastName} {e.firstName} {e.patronymic||''}
                          {!inPeriod && <span style={{marginLeft:6,fontSize:10,color:'#856404',background:'#fff3cd',padding:'1px 5px',borderRadius:3}}>не в цьому місяці</span>}
                        </td>
                        <td style={{fontSize:11,color:'#5a7a5a'}}>{e.milRnokpp||e.taxId||'—'}</td>
                        <td>
                          <input type="number" min="0" step="0.01"
                            value={salaries[e.id]||''}
                            style={{width:'100%',padding:'4px 6px',fontSize:13,borderRadius:4,border:'1px solid #c8d8c8',textAlign:'right'}}
                            onChange={ev=>setSalaries(p=>({...p,[e.id]:ev.target.value}))}
                            placeholder="0.00"/>
                        </td>
                        <td>
                          <select value={contractTypes[e.id]||'1'}
                            onChange={ev=>setContractTypes(p=>({...p,[e.id]:ev.target.value}))}
                            style={{width:'100%',padding:'3px 4px',fontSize:11,borderRadius:4,border:'1px solid #c8d8c8'}}>
                            <option value="1">1 — зарплата за відпрацьований час</option>
                            <option value="10">10 — відпускні (дні відпустки)</option>
                            <option value="7">7 — лікарняні (перші 5 днів)</option>
                            <option value="4">4 — лікарняні від ФСС (з 6-го дня)</option>
                            <option value="5">5 — матдопомога на оздоровлення</option>
                            <option value="14">14 — премія</option>
                            <option value="2">2 — винагорода за ЦПД</option>
                          </select>
                        </td>
                        <td style={{textAlign:'right',fontSize:12,color:'var(--red)'}}>{sal>0?n2(sal*0.18):'—'}</td>
                        <td style={{textAlign:'right',fontSize:12,color:'#0c5460'}}>{sal>0?n2(sal*0.05):'—'}</td>
                        <td style={{textAlign:'right',fontSize:12,color:'var(--green)'}}>{sal>0?n2(sal*0.22):'—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Renters */}
          <div className="card" style={{marginBottom:12}}>
            <div className="card-header">
              <span className="card-title">🌾 Орендодавці землі (ознака 157)</span>
              <button className="btn btn-sm" style={{background:"var(--gold)",color:"var(--dark)",fontWeight:600}} onClick={addRenter}>+ Додати орендодавця</button>
            </div>
            {renters.length > 0 && (
              <div style={{padding:'12px 20px'}}>
                <table>
                  <thead><tr>
                    <th>ІПН</th><th>Прізвище</th><th>Ім'я</th><th>По батькові</th>
                    <th style={{width:80}}>Місяць</th><th style={{width:140}}>Сума орендної плати, грн</th>
                    <th style={{width:36}}></th>
                  </tr></thead>
                  <tbody>
                    {renters.map(r=>(
                      <tr key={r.id}>
                        <td><input value={r.tin} onChange={e=>updateRenter(r.id,'tin',e.target.value)} style={{width:'100%',padding:'3px 5px',fontSize:12,border:'1px solid #c8d8c8',borderRadius:3}} placeholder="ІПН"/></td>
                        <td><input value={r.lastName||''} onChange={e=>updateRenter(r.id,'lastName',e.target.value)} style={{width:'100%',padding:'3px 5px',fontSize:12,border:'1px solid #c8d8c8',borderRadius:3}} placeholder="Прізвище"/></td>
                        <td><input value={r.firstName||''} onChange={e=>updateRenter(r.id,'firstName',e.target.value)} style={{width:'100%',padding:'3px 5px',fontSize:12,border:'1px solid #c8d8c8',borderRadius:3}} placeholder={"Ім'я"}/></td>
                        <td><input value={r.patronymic||''} onChange={e=>updateRenter(r.id,'patronymic',e.target.value)} style={{width:'100%',padding:'3px 5px',fontSize:12,border:'1px solid #c8d8c8',borderRadius:3}} placeholder="По батькові"/></td>
                        <td><select value={r.month||period.month} onChange={e=>updateRenter(r.id,'month',parseInt(e.target.value))} style={{fontSize:12,padding:'3px'}}>
                          {MONTHS.slice(1).map((m,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
                        </select></td>
                        <td><input type="number" min="0" step="0.01" value={r.salary||''} onChange={e=>updateRenter(r.id,'salary',e.target.value)} style={{width:'100%',padding:'3px 5px',fontSize:12,border:'1px solid #c8d8c8',borderRadius:3,textAlign:'right'}} placeholder="0.00"/></td>
                        <td><button className="btn btn-sm btn-danger" onClick={()=>removeRenter(r.id)}>×</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {renters.length === 0 && <div style={{padding:'12px 20px',fontSize:12,color:'#8aaa8a'}}>Немає орендодавців — натисніть "+ Додати" якщо є</div>}
          </div>
        </div>

        {/* RIGHT: Summary + actions */}
        <div style={{position:'sticky',top:20}}>
          <div className="card" style={{marginBottom:12}}>
            <div className="card-header"><span className="card-title">📋 Зведені показники</span></div>
            <div style={{padding:'16px'}}>
              {[
                ['Зарплата штатних', n2(totalSalary)+' грн', 'var(--dark)'],
                ['Орендна плата', n2(totalRent)+' грн', '#5a7a5a'],
                ['ВСЬОГО доходів', n2(totalIncome)+' грн', 'var(--green)'],
                ['ПДФО 18%', n2(totalPdfo)+' грн', 'var(--red)'],
                ['ВЗ 5%', n2(totalVz)+' грн', '#0c5460'],
                ['ЄСВ 22%', n2(totalEsv)+' грн', 'var(--green)'],
              ].map(([l,v,c])=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--light)',fontSize:13}}>
                  <span style={{color:'#5a7a5a'}}>{l}</span>
                  <strong style={{color:c}}>{v}</strong>
                </div>
              ))}
              <div style={{marginTop:12,padding:'8px 10px',background:'var(--light)',borderRadius:6,fontSize:11,color:'#5a7a5a'}}>
                Ставки: ПДФО 18% · ВЗ 5% · ЄСВ 22%
              </div>
            </div>
          </div>

          <div className="card">
            <div style={{padding:'16px'}}>
              <button className="btn btn-primary" style={{width:'100%',padding:'12px',fontSize:14,marginBottom:10}}
                onClick={handleGenerate} disabled={generating}>
                {generating ? '⏳ Генерація...' : '📥 Завантажити 3 XML файли'}
              </button>
              <button className="btn btn-outline" style={{width:'100%',padding:'10px',fontSize:13,marginBottom:10}}
                onClick={handlePdfPrint}>
                🖨️ PDF для архіву (Ctrl+P)
              </button>
              <div style={{fontSize:11,color:'#6a8a6a',lineHeight:1.6}}>
                <strong>Інструкція:</strong><br/>
                1. Введіть суми зарплат<br/>
                2. Натисніть "Завантажити 3 XML"<br/>
                3. Завантажте файли в кабінет платника ДПС<br/>
                4. Підпишіть КЕП та надішліть
              </div>
            </div>
          </div>

          <div style={{marginTop:12,padding:'10px 14px',background:'#fff3cd',border:'1px solid #ffc107',borderRadius:8,fontSize:11}}>
            <strong>⚠️ Важливо:</strong> Перевірте суми перед відправкою. ІПН орендодавців вводьте вручну.
          </div>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
