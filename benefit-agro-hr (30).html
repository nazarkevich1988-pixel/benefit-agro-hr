const H = { "Content-Type":"application/json","apikey":SUPABASE_ANON,"Authorization":`Bearer ${SUPABASE_ANON}`,"Prefer":"return=representation" };

async function sbSelect(table, params=""){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`,{headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbInsert(table,data){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:"POST",headers:H,body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpdate(table,id,data){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:"PATCH",headers:H,body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table,id){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:"DELETE",headers:H});
  if(!r.ok) throw new Error(await r.text());
}
async function sbUpsert(table,data){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function generateTckNotice(emp, order, noticeType) {
  const rawDate = order.date || '';
  const dp = rawDate.split('-');
  const orderDate = dp.length===3 ? dp[2]+'.'+dp[1]+'.'+dp[0] : rawDate;
  const months = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  const mw = months[parseInt(dp[1]||'1')-1]||'';

function TckAlertPanel({orders, employees, notices, showToast}) {
  const [dismissed, setDismissed] = React.useState([]);
  const now = new Date();
  const alerts = [];
  orders.forEach(order => {
    if (!['hire','fire','transfer'].includes(order.type)) return;
    const diff = Math.round((now - new Date(order.date)) / 86400000);
    if (diff > 30 || diff < 0) return;
    const ids = (order.employeeIds && order.employeeIds.length > 0) ? order.employeeIds : (order.employeeId ? [order.employeeId] : []);
    ids.forEach(id => {
      const emp = employees.find(e => e.id === id);
      if (!emp || (!emp.military && emp.status !== 'military')) return;
      const key = order.id + '_' + id;
      if (dismissed.includes(key)) return;
      // Check if notice already in registry with sent/delivered status
      const alreadySent = notices && notices.some(n =>
        n.employeeId === id &&
        n.orderId === order.id &&
        (n.status === 'sent' || n.status === 'delivered')
      );
      if (alreadySent) return;
      alerts.push({key, order, emp, daysLeft: 7 - diff});
    });
  });
  if (alerts.length === 0) return null;
  return (
    <div style={{background:'#fff3cd',border:'2px solid #ffc107',borderRadius:8,padding:'14px 18px',marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <span style={{fontSize:20}}>⚠️</span>
        <strong style={{fontSize:14,color:'#856404'}}>Потрібно повідомити ТЦК (Додаток 4, п.34 Порядку №1487)</strong>
      </div>
      {alerts.map(({key,order,emp,daysLeft}) => {
        const dp2=(order.date||'').split('-');
        const od=dp2.length===3?dp2[2]+'.'+dp2[1]+'.'+dp2[0]:order.date||'';
        const tl=order.type==='hire'?'прийнятий':order.type==='fire'?'звільнений':'переведений';
        return (
          <div key={key} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #ffeeba',flexWrap:'wrap',gap:8}}>
            <div>
              <span style={{fontWeight:600}}>{emp.lastName} {emp.firstName}</span>
              {' — '}{tl}{' (наказ №'}{order.number}{' від '}{od}{')'}<br/>
              <small style={daysLeft<=2?{color:'#721c24',fontWeight:'bold'}:{}}>{daysLeft>0?'Залишилось '+daysLeft+' дн. для подачі до ТЦК':'🚨 Строк вичерпано!'}</small>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-sm" style={{background:'#856404',color:'#fff'}} onClick={()=>generateTckNotice(emp,order,order.type)}>📄 Сформувати</button>
              <button className="btn btn-sm btn-outline" onClick={()=>setDismissed(p=>[...p,key])}>✓ Відправлено</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

                    {Object.entries(STATUSES).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                  </select>
                </div>
                <div className="form-group span2">
                  <label style={{flexDirection:"row",alignItems:"center",gap:8,cursor:"pointer"}}>
                    <input type="checkbox" checked={!!form.military} onChange={f("military")} style={{width:"auto"}}/>
                    Військовозобов'язаний
                  </label>
                </div>
                <div className="form-group span2"><label>Примітки</label><textarea value={form.notes||""} onChange={f("notes")}/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setModal(false)}>Скасувати</button>
              <button className="btn btn-primary" onClick={save} disabled={saving}>
                {saving?<><span className="spinner"/>Збереження…</>:"Зберегти"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══ LEAVES ═════════════════════════════════════════════════════════════════
function Leaves({employees,leaves,setLeaves,showToast}){
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({});
  const [tab,setTab]=useState("active");
  const [saving,setSaving]=useState(false);
  const now=today();
  const active=leaves.filter(l=>l.dateEnd>=now);
  const past=leaves.filter(l=>l.dateEnd<now);
  const shown=tab==="active"?active:past;
  const f=k=>v=>setForm(p=>({...p,[k]:v.target?.value??v}));

  const save=async()=>{
    if(!form.employeeId||!form.dateStart||!form.dateEnd)return alert("Заповніть усі поля");
    setSaving(true);
    try{
      const id=uid();
      await sbInsert("leaves",{id,employee_id:form.employeeId,type:form.type||"vacation",date_start:form.dateStart,date_end:form.dateEnd,note:form.note||null});
      setLeaves(prev=>[{...form,id,employeeId:form.employeeId,dateStart:form.dateStart,dateEnd:form.dateEnd},...prev]);
      showToast("Запис додано ✓");setModal(false);
    }catch(err){showToast("Помилка: "+err.message,"error");}
    setSaving(false);
  };

  const remove=async id=>{
    if(!confirm("Видалити запис?"))return;
    try{await sbDelete("leaves",id);setLeaves(prev=>prev.filter(l=>l.id!==id));showToast("Видалено ✓");}
    catch(err){showToast("Помилка: "+err.message,"error");}
  };

  return(
    <div>
      <div className="page-header">
        <div className="page-title">🌿 Відпустки та лікарняні</div>
        <div className="page-sub">Облік тимчасової відсутності</div>
      </div>
      <div className="card">
        <div className="card-header">
          <span className="card-title">Записи</span>
          <button className="btn btn-gold btn-sm" onClick={()=>{setForm({type:"vacation",dateStart:today()});setModal(true);}}>+ Додати</button>
        </div>
        <div style={{padding:"12px 20px 0"}}>
          <div className="tabs">
            <div className={"tab " + (tab==="active"?"active":"")} onClick={()=>setTab("active")}>Активні ({active.length})</div>
            <div className={"tab " + (tab==="past"?"active":"")} onClick={()=>setTab("past")}>Минулі ({past.length})</div>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>Працівник</th><th>Тип</th><th>З</th><th>По</th><th>Днів</th><th>Підстава</th><th></th></tr></thead>
            <tbody>
              {shown.length===0&&<tr><td colSpan={7}><div className="empty"><div className="empty-icon">🌿</div>Записів немає</div></td></tr>}
              {shown.map(l=>{
                const e=employees.find(e=>e.id===l.employeeId);
                const days=diffDays(l.dateStart,l.dateEnd)+1;
                return(<tr key={l.id}>
                  <td>{e?<><strong>{e.lastName}</strong> {e.firstName[0]}.{e.patronymic?.[0]}.</>:"—"}</td>
                  <td><span className={"badge badge-" + l.type}>{l.type==="vacation"?"☀️ Відпустка":l.type==="sick"?"🤒 Лікарняний":"Інше"}</span></td>
                  <td>{fmt(l.dateStart)}</td><td>{fmt(l.dateEnd)}</td><td><strong>{days}</strong></td>
                  <td style={{fontSize:12}}>{l.note||"—"}</td>
                  <td><button className="btn btn-sm btn-danger" onClick={()=>remove(l.id)}>🗑</button></td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </div>
      {modal&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setModal(false)}>
          <div className="modal">
            <div className="modal-header"><span className="modal-title">Новий запис</span><button className="modal-close" onClick={()=>setModal(false)}>×</button></div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="form-group span2"><label>Працівник *</label>
                  <select value={form.employeeId||""} onChange={f("employeeId")}>
                    <option value="">— оберіть —</option>
                    {employees.filter(e=>e.status!=="fired").map(e=><option key={e.id} value={e.id}>{e.lastName} {e.firstName} {e.patronymic}</option>)}
                  </select>
                </div>
                <div className="form-group span2"><label>Тип</label>
                  <select value={form.type||"vacation"} onChange={f("type")}>
                    <option value="vacation">☀️ Відпустка</option>
                    <option value="sick">🤒 Лікарняний</option>
                    <option value="other">Інше</option>
                  </select>
                </div>
                <div className="form-group"><label>Дата початку *</label><input type="date" value={form.dateStart||""} onChange={f("dateStart")}/></div>
                <div className="form-group"><label>Дата закінчення *</label><input type="date" value={form.dateEnd||""} onChange={f("dateEnd")}/></div>
                <div className="form-group span2"><label>Підстава / наказ №</label><input value={form.note||""} onChange={f("note")}/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setModal(false)}>Скасувати</button>
              <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?"Збереження…":"Зберегти"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}



// ═══ ORDERS ═════════════════════════════════════════════════════════════════
function Orders({employees,orders,setOrders,notices,showToast}){
  const YEARS=[2021,2022,2023,2024,2025,2026];
  const curYear=new Date().getFullYear();
  const [activeGroup,setActiveGroup]=React.useState('personnel');
  const [activeYear,setActiveYear]=React.useState(curYear);
  const [search,setSearch]=React.useState('');
  const [filterType,setFilterType]=React.useState('');
  const [modal,setModal]=React.useState(false);
  const [viewOrder,setViewOrder]=React.useState(null);
  const [editOrder,setEditOrder]=React.useState(null);
  const [editForm,setEditForm]=React.useState({});
  const [form,setForm]=React.useState({});
  const [saving,setSaving]=React.useState(false);
  const [uploading,setUploading]=React.useState(false);
  const fileRef=React.useRef();
  const editFileRef=React.useRef();

  const curGroup=ORDER_GROUPS.find(g=>g.id===activeGroup)||ORDER_GROUPS[0];
  const getYear=o=>o.year||(o.date?new Date(o.date).getFullYear():0);
  const groupOrders=orders.filter(o=>curGroup.types.includes(o.type));
  const yearOrders=groupOrders.filter(o=>getYear(o)===activeYear);
  const filtered=yearOrders.filter(o=>{
    const q=search.toLowerCase();
    const ids=(o.employeeIds&&o.employeeIds.length>0)?o.employeeIds:(o.employeeId?[o.employeeId]:[]);
    const names=ids.map(id=>{const e=employees.find(e=>e.id===id);return e?e.lastName+' '+e.firstName:'';}).join(' ').toLowerCase();
    const ok=names.includes(q)||String(o.number).includes(q)||(ORDER_TYPES[o.type]||'').toLowerCase().includes(q)||(o.content||'').toLowerCase().includes(q);
    return ok&&(filterType?o.type===filterType:true);
  }).sort((a,b)=>Number(a.number)-Number(b.number));

  const nextNum=()=>{const nums=yearOrders.map(o=>Number(o.number)||0);return nums.length?Math.max(...nums)+1:1;};
  const f=k=>v=>setForm(p=>({...p,[k]:v.target?.value??v}));

  const uploadFile=async(file,orderId)=>{
    if(!file)return null;
    setUploading(true);
    try{
      const ext=file.name.split('.').pop();
      const path=orderId+'.'+ext;
      const r=await fetch(SUPABASE_URL+'/storage/v1/object/orders-files/'+path,{method:'POST',headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':file.type},body:file});
      if(!r.ok)throw new Error(await r.text());
      return{url:SUPABASE_URL+'/storage/v1/object/public/orders-files/'+path,name:file.name};
    }catch(err){showToast('Помилка файлу: '+err.message,'error');return null;}
    finally{setUploading(false);}
  };

  const save=async()=>{
    if(!form.number||!form.date)return alert('Введіть номер і дату');
    setSaving(true);
    try{
      const id=uid(),y=new Date(form.date).getFullYear();
      let fileUrl=null,fileName=null;
      if(fileRef.current&&fileRef.current.files[0]){const res=await uploadFile(fileRef.current.files[0],id);if(res){fileUrl=res.url;fileName=res.name;}}
      const empIds=form.employeeIds||[];
      await sbInsert('orders',{id,number:Number(form.number),date:form.date,type:form.type||curGroup.types[0],employee_id:empIds[0]||null,employee_ids:JSON.stringify(empIds),content:form.content||null,year:y,basis:form.basis||null,signed_by:form.signedBy||null,file_url:fileUrl,file_name:fileName});
      setOrders(prev=>[{...form,id,year:y,fileUrl,fileName,employeeIds:empIds},...prev]);
      showToast('Наказ додано');setModal(false);
    }catch(err){showToast('Помилка: '+err.message,'error');}
    setSaving(false);
  };

  const saveEdit=async()=>{
    if(!editForm.number||!editForm.date)return alert('Введіть номер і дату');
    setSaving(true);
    try{
      let fileUrl=editOrder.fileUrl,fileName=editOrder.fileName;
      if(editFileRef.current&&editFileRef.current.files[0]){const res=await uploadFile(editFileRef.current.files[0],editOrder.id);if(res){fileUrl=res.url;fileName=res.name;}}
      const empIds=editForm.employeeIds||[];
      await sbUpdate('orders',editOrder.id,{number:Number(editForm.number),date:editForm.date,type:editForm.type,employee_id:empIds[0]||null,employee_ids:JSON.stringify(empIds),content:editForm.content||null,year:new Date(editForm.date).getFullYear(),basis:editForm.basis||null,signed_by:editForm.signedBy||null,file_url:fileUrl,file_name:fileName});
      setOrders(prev=>prev.map(o=>o.id===editOrder.id?{...o,...editForm,fileUrl,fileName,year:new Date(editForm.date).getFullYear(),employeeIds:empIds}:o));
      showToast('Збережено');setEditOrder(null);setViewOrder(null);
    }catch(err){showToast('Помилка: '+err.message,'error');}
    setSaving(false);
  };

  const remove=async id=>{
    if(!confirm('Видалити наказ?'))return;
    try{await sbDelete('orders',id);setOrders(prev=>prev.filter(o=>o.id!==id));showToast('Видалено');}
    catch(err){showToast('Помилка: '+err.message,'error');}
  };

  const empName=id=>{const e=employees.find(e=>e.id===id);return e?e.lastName+' '+e.firstName+' '+(e.patronymic||''):'—';};
  const empNames=o=>{
    const ids=(o.employeeIds&&o.employeeIds.length>0)?o.employeeIds:(o.employeeId?[o.employeeId]:[]);
    if(!ids.length)return '—';
    if(ids.length===1)return empName(ids[0]);
    return ids.map(id=>{const e=employees.find(e=>e.id===id);return e?e.lastName+' '+e.firstName[0]+'.':'?';}).join(', ')+' ('+ids.length+' ос.)';
  };
  const typeBadge=type=>{
    const cls=type==='hire'?'badge-active':type==='fire'?'badge-fired':['vacation','vacation_schedule'].includes(type)?'badge-vacation':'badge-military';
    return React.createElement('span',{className:'badge '+cls},ORDER_TYPES[type]||'Інший');
  };

  const exportExcel=()=>{
    const thS='background:#2d6a2d;color:#fff;border:1px solid #999;padding:5px 6px;font-size:8pt;text-align:center';
    const heads=['№','Номер наказу','Дата','Вид наказу','Працівник','Зміст','Підстава'];
    const hRow=heads.map(h=>'<th style="'+thS+'">'+h+'</th>').join('');
    const dRows=filtered.map((o,i)=>{
      const ids=(o.employeeIds&&o.employeeIds.length>0)?o.employeeIds:(o.employeeId?[o.employeeId]:[]);
      const nm=ids.map(id=>{const e=employees.find(e=>e.id===id);return e?e.lastName+' '+e.firstName:'?';}).join(', ')||'—';
      return '<tr><td>'+(i+1)+'</td><td>'+o.number+'</td><td>'+fmt(o.date)+'</td><td>'+(ORDER_TYPES[o.type]||'Інший')+'</td><td>'+nm+'</td><td>'+(o.content||'—')+'</td><td>'+(o.basis||'—')+'</td></tr>';
    }).join('');
    const xls='<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse}td{border:1px solid #ccc;padding:4px 6px;font-size:9pt}</style></head><body><h3>'+curGroup.label+' — '+activeYear+' — ФГ БЕНЕФІТ-АГРО</h3><table><tr>'+hRow+'</tr>'+dRows+'</table><' + '/body><' + '/html>';
    const blob=new Blob(['\uFEFF'+xls],{type:'application/vnd.ms-excel;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Реєстр_'+curGroup.id+'_'+activeYear+'.xls';a.click();
    showToast('Реєстр завантажено');
  };

  const EmpCheckboxes=({value,onChange})=>(
    React.createElement('div',{style:{maxHeight:160,overflowY:'auto',border:'1px solid #c8d8c8',borderRadius:6,padding:'6px 10px',background:'#fff'}},
      employees.filter(e=>e.status!=='fired').map(e=>
        React.createElement('label',{key:e.id,style:{display:'flex',alignItems:'center',gap:8,padding:'3px 0',cursor:'pointer',fontWeight:400,fontSize:13}},
          React.createElement('input',{type:'checkbox',checked:(value||[]).includes(e.id),onChange:ev=>{const ids=value||[];onChange(ev.target.checked?[...ids,e.id]:ids.filter(i=>i!==e.id));},style:{width:'auto'}}),
          e.lastName+' '+e.firstName+' '+(e.patronymic||'')
        )
      )
    )
  );

  return(
    <div>
      <div className="page-header">
        <div className="page-title">📋 Реєстр наказів</div>
        <div className="page-sub">ФГ «БЕНЕФІТ-АГРО» · {orders.length} наказів загалом</div>
      </div>

      <TckAlertPanel orders={orders} employees={employees} notices={notices||[]} showToast={showToast}/>

      {/* GROUP TABS */}
      <div style={{display:'flex',gap:4,marginBottom:0}}>
        {ORDER_GROUPS.map(g=>{
          const cnt=orders.filter(o=>g.types.includes(o.type)).length;
          const isActive=activeGroup===g.id;
          return(
            <div key={g.id} onClick={()=>{setActiveGroup(g.id);setFilterType('');setSearch('');}}
              style={{padding:'12px 20px',cursor:'pointer',fontSize:13,fontWeight:600,
                background:isActive?g.color:'#e8e8e8',color:isActive?'#fff':'#666',
                borderRadius:'8px 8px 0 0',transition:'all .15s'}}>
              {g.icon} {g.label}
              <span style={{marginLeft:6,background:'rgba(255,255,255,.25)',borderRadius:10,padding:'1px 7px',fontSize:11}}>{cnt}</span>
            </div>
          );
        })}
      </div>

      <div className="card" style={{borderRadius:'0 8px 8px 8px',marginBottom:0}}>
        {/* YEAR + ACTIONS */}
        <div style={{padding:'0 16px',background:'var(--dark)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex'}}>
            {YEARS.map(y=>{
              const cnt=groupOrders.filter(o=>getYear(o)===y).length;
              return(
                <div key={y} onClick={()=>setActiveYear(y)}
                  style={{padding:'11px 15px',cursor:'pointer',fontSize:12,fontWeight:600,
                    color:activeYear===y?'var(--gold)':'#8aac8a',
                    borderBottom:activeYear===y?'2px solid var(--gold)':'2px solid transparent'}}>
                  {y}{cnt>0&&<span style={{marginLeft:4,background:activeYear===y?'var(--gold)':'#3d5c3d',color:activeYear===y?'var(--dark)':'#adc9ad',borderRadius:10,padding:'1px 5px',fontSize:10}}>{cnt}</span>}
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-gold btn-sm" onClick={exportExcel}>⬇️ Excel</button>
            <button className="btn btn-sm" style={{background:'var(--green2)',color:'#fff'}} onClick={()=>{setForm({date:today(),number:nextNum(),type:curGroup.types[0],employeeIds:[]});setModal(true);}}>+ Новий наказ</button>
          </div>
        </div>

        {/* TYPE FILTER CHIPS */}
        <div style={{display:'flex',gap:8,padding:'10px 16px',background:'#f8faf8',borderBottom:'1px solid var(--light)',flexWrap:'wrap',alignItems:'center'}}>
          {curGroup.types.map(t=>{
            const cnt=yearOrders.filter(o=>o.type===t).length;
            if(cnt===0)return null;
            return(
              <div key={t} onClick={()=>setFilterType(filterType===t?'':t)}
                style={{padding:'3px 12px',borderRadius:20,cursor:'pointer',fontSize:11,fontWeight:600,
                  background:filterType===t?curGroup.color:'#e0e0e0',color:filterType===t?'#fff':'#555',transition:'all .15s'}}>
                {ORDER_TYPES[t]}: {cnt}
              </div>
            );
          })}
          {filterType&&<button className="btn btn-sm btn-outline" style={{fontSize:10,padding:'2px 8px'}} onClick={()=>setFilterType('')}>✕</button>}
          <input className="search-box" style={{marginLeft:'auto',maxWidth:240,padding:'5px 10px',fontSize:12}} placeholder="Пошук…" value={search} onChange={e=>setSearch(e.target.value)}/>
          <span style={{fontSize:11,color:'#5a7a5a',whiteSpace:'nowrap'}}>{filtered.length} зап.</span>
        </div>

        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr>
              <th style={{width:70}}>№</th><th style={{width:95}}>Дата</th>
              <th>Вид наказу</th><th>Працівник</th><th>Зміст</th>
              <th style={{width:46}}>📎</th><th style={{width:90}}></th>
            </tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={7}><div className="empty"><div className="empty-icon">📋</div>{curGroup.label} за {activeYear} — порожньо</div></td></tr>}
              {filtered.map(o=>(
                <tr key={o.id} style={{cursor:'pointer'}} onClick={()=>setViewOrder(o)}>
                  <td><strong style={{color:'var(--green)'}}>{o.number}</strong></td>
                  <td style={{whiteSpace:'nowrap'}}>{fmt(o.date)}</td>
                  <td>{typeBadge(o.type)}</td>
                  <td style={{fontWeight:500,fontSize:12}}>{empNames(o)}</td>
                  <td style={{fontSize:12,color:'#4a6a4a',maxWidth:200}}>{o.content||'—'}</td>
                  <td style={{textAlign:'center'}}>{o.fileUrl?<span style={{fontSize:17}} onClick={e=>{e.stopPropagation();window.open(o.fileUrl,'_blank');}}>📎</span>:<span style={{color:'#ddd'}}>—</span>}</td>
                  <td onClick={e=>e.stopPropagation()}><div className="actions">
                    <button className="btn btn-sm btn-outline" onClick={e=>{e.stopPropagation();setViewOrder(o);}}>👁</button>
                    <button className="btn btn-sm btn-outline" onClick={e=>{e.stopPropagation();setEditForm({...o,employeeIds:o.employeeIds&&o.employeeIds.length>0?o.employeeIds:(o.employeeId?[o.employeeId]:[]),signedBy:o.signedBy||''});setEditOrder(o);}}>✏️</button>
                    <button className="btn btn-sm btn-danger" onClick={e=>{e.stopPropagation();remove(o.id);}}>🗑</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* VIEW MODAL */}
      {viewOrder&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setViewOrder(null)}>
          <div className="modal" style={{maxWidth:660}}>
            <div className="modal-header">
              <span className="modal-title">📋 Наказ №{viewOrder.number} від {fmt(viewOrder.date)}</span>
              <button className="modal-close" onClick={()=>setViewOrder(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
                <div style={{background:'var(--light)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:'#6a8a6a',fontWeight:600,textTransform:'uppercase',marginBottom:3}}>Тип</div>
                  <div>{typeBadge(viewOrder.type)}</div>
                </div>
                <div style={{background:'var(--light)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:'#6a8a6a',fontWeight:600,textTransform:'uppercase',marginBottom:3}}>Працівник(и)</div>
                  <div style={{fontWeight:600,fontSize:13}}>
                    {(viewOrder.employeeIds&&viewOrder.employeeIds.length>0?viewOrder.employeeIds:(viewOrder.employeeId?[viewOrder.employeeId]:[])).map(id=><div key={id}>{empName(id)}</div>)}
                  </div>
                </div>
                <div style={{background:'var(--light)',borderRadius:8,padding:'10px 12px',gridColumn:'span 2'}}>
                  <div style={{fontSize:10,color:'#6a8a6a',fontWeight:600,textTransform:'uppercase',marginBottom:3}}>Зміст</div>
                  <div style={{fontSize:13}}>{viewOrder.content||'—'}</div>
                </div>
                {viewOrder.basis&&<div style={{background:'var(--light)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:'#6a8a6a',fontWeight:600,textTransform:'uppercase',marginBottom:3}}>Підстава</div>
                  <div style={{fontSize:13}}>{viewOrder.basis}</div>
                </div>}
              </div>
              {viewOrder.fileUrl?(

// ═══ TIMESHEET ══════════════════════════════════════════════════════════════
function Timesheet({employees,timesheet,setTimesheet,showToast}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth()+1);
  const activeEmps=employees.filter(e=>e.status!=="fired");
  const daysInMonth=new Date(year,month,0).getDate();
  const days=Array.from({length:daysInMonth},(_,i)=>i+1);

  const getVal=(empId,day)=>{
    const d=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    return timesheet.find(t=>t.employeeId===empId&&t.workDate===d)?.val??"";
  };

  const setVal=async(empId,day,val)=>{
    const workDate=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const existing=timesheet.find(t=>t.employeeId===empId&&t.workDate===workDate);
    try{
      if(val){
        const id=existing?.id||uid();
        await sbUpsert("timesheet",{id,employee_id:empId,work_date:workDate,val});
        setTimesheet(prev=>{
          const f=prev.filter(t=>!(t.employeeId===empId&&t.workDate===workDate));
          return[...f,{id,employeeId:empId,workDate,val}];
        });
      }else if(existing){
        await sbDelete("timesheet",existing.id);
        setTimesheet(prev=>prev.filter(t=>!(t.employeeId===empId&&t.workDate===workDate)));
      }
    }catch(err){showToast("Помилка: "+err.message,"error");}
  };

  const countFor=empId=>timesheet.filter(t=>{
    if(t.employeeId!==empId)return false;
    const d=new Date(t.workDate);
    return d.getFullYear()===year&&d.getMonth()+1===month&&(t.val==="Р"||(!isNaN(Number(t.val))&&t.val!==""));
  }).length;

  const isWeekend=day=>{const d=new Date(year,month-1,day).getDay();return d===0||d===6;};

  return(
    <div>
      <div className="page-header">
        <div className="page-title">📅 Табель робочого часу</div>
        <div className="page-sub">Р — робочий · В — вихідний · Л — лікарняний · Вдп — відпустка · числа — години</div>
      </div>
      <div className="card">
        <div className="card-header">
          <span className="card-title">{MONTHS[month-1]} {year}</span>
          <div style={{display:"flex",gap:8}}>
            <select className="select-filter" value={month} onChange={e=>setMonth(Number(e.target.value))}>
              {MONTHS.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </select>
            <select className="select-filter" value={year} onChange={e=>setYear(Number(e.target.value))}>
              {[2023,2024,2025,2026,2027].map(y=><option key={y}>{y}</option>)}
            </select>
          </div>
        </div>
        <div style={{overflowX:"auto",padding:"0 0 8px"}}>
          <table style={{minWidth:900}}>
            <thead>
              <tr>
                <th style={{minWidth:140,position:"sticky",left:0,background:"#fafcfa",zIndex:2}}>Працівник</th>
                {days.map(d=><th key={d} style={{minWidth:32,textAlign:"center",color:isWeekend(d)?"#b04040":undefined,fontSize:11}}>{d}</th>)}
                <th style={{textAlign:"center"}}>Разом</th>
              </tr>
            </thead>
            <tbody>
              {activeEmps.length===0&&<tr><td colSpan={35}><div className="empty"><div className="empty-icon">📅</div>Немає активних працівників</div></td></tr>}
              {activeEmps.map(e=>(
                <tr key={e.id}>
                  <td style={{position:"sticky",left:0,background:"#fff",fontWeight:600,fontSize:12,zIndex:1,whiteSpace:"nowrap"}}>{e.lastName} {e.firstName[0]}.</td>
                  {days.map(d=>(
                    <td key={d} style={{padding:"2px",textAlign:"center"}}>
                      <input
                        value={getVal(e.id,d)}
                        onChange={ev=>setVal(e.id,d,ev.target.value)}
                        style={{width:30,textAlign:"center",border:"1px solid #ddd",borderRadius:4,padding:"3px 0",fontSize:11,background:isWeekend(d)?"#fef8f8":"#fff",fontFamily:"Golos Text,sans-serif"}}
                        maxLength={3}
                      />
                    </td>
                  ))}
                  <td style={{textAlign:"center",fontWeight:700,color:"var(--green)",fontSize:14}}>{countFor(e.id)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

                  <td style={{minWidth:80,fontSize:10}}>{e.milAdrFakt||"—"}</td>
                  <td style={{minWidth:100,fontSize:10}}>{e.milTck||"—"}</td>
                  <td style={{textAlign:"center",fontSize:10}}>{e.milSpecOblik||"—"}</td>
                  <td style={{textAlign:"center"}}>{e.milPrydatnist||"—"}</td>
                  <td style={{minWidth:100,fontSize:10}}>{e.milSimya||"—"}</td>
                  <td style={{minWidth:100,fontSize:10}}>{e.milPosadaAkt||e.position||"—"}</td>
                  <td style={{minWidth:90,fontSize:10}}>{e.milPovid||"—"}</td>
                  <td><span className={"badge badge-" + (e.status==="military"?"military":"active")}>{e.status==="military"?"🪖 Мобіліз.":"✅ На роботі"}</span></td>
                  <td>
                    <div className="actions">
                      <button className="btn btn-sm btn-outline" title="Редагувати військові дані" onClick={()=>openEdit(e)}>✏️</button>
                      <button className={"btn btn-sm " + (e.status==="military"?"btn-primary":"btn-outline")} onClick={()=>toggle(e)}>{e.status==="military"?"←":"🪖"}</button>
                    </div>
                  </td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Модал редагування військових даних */}
      {editId&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEditId(null)}>
          <div className="modal" style={{maxWidth:680}}>
            <div className="modal-header">
              <span className="modal-title">🪖 Військові дані · {mil.find(e=>e.id===editId)?.lastName}</span>
              <button className="modal-close" onClick={()=>setEditId(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="form-group"><label>Військове звання</label><input value={editForm.milRank||""} onChange={f("milRank")}/></div>
                <div className="form-group"><label>РНОКПП / Реєстр. номер ЄДР</label><input value={editForm.milRnokpp||""} onChange={f("milRnokpp")}/></div>
                <div className="form-group"><label>Військово-облікова спеціальність</label><input value={editForm.milVos||""} onChange={f("milVos")}/></div>
                <div className="form-group"><label>Склад / профіль</label><input value={editForm.milSklad||""} onChange={f("milSklad")}/></div>
                <div className="form-group span2"><label>Категорія обліку / Військово-обліковий документ</label><input value={editForm.milKat||""} onChange={f("milKat")}/></div>
                <div className="form-group span2"><label>Освіта та спеціальність</label><input value={editForm.milOsvita||""} onChange={f("milOsvita")}/></div>
                <div className="form-group span2"><label>Реквізити паспорта</label><input value={editForm.milPassport||""} onChange={f("milPassport")}/></div>
                <div className="form-group"><label>Адреса задекларована (зареєстрована)</label><input value={editForm.milAdrReg||""} onChange={f("milAdrReg")}/></div>
                <div className="form-group"><label>Адреса фактичного проживання</label><input value={editForm.milAdrFakt||""} onChange={f("milAdrFakt")}/></div>
                <div className="form-group span2"><label>ТЦК та СП (де перебуває на обліку)</label><input value={editForm.milTck||""} onChange={f("milTck")}/></div>
                <div className="form-group"><label>Спец. облік / номер команди</label><input value={editForm.milSpecOblik||""} onChange={f("milSpecOblik")} placeholder="—"/></div>
                <div className="form-group"><label>Придатність до військової служби</label>
                  <select value={editForm.milPrydatnist||"придатний"} onChange={f("milPrydatnist")}>
                    <option>придатний</option>
                    <option>обмежено придатний</option>
                    <option>тимчасово непридатний</option>
                    <option>непридатний</option>
                  </select>
                </div>
                <div className="form-group span2"><label>Сімейний стан, члени сім'ї</label><textarea value={editForm.milSimya||""} onChange={f("milSimya")} rows={2}/></div>
                <div className="form-group span2"><label>Посада, реквізити акта про призначення</label><input value={editForm.milPosadaAkt||""} onChange={f("milPosadaAkt")}/></div>
                <div className="form-group span2"><label>Реквізити повідомлення про призначення</label><input value={editForm.milPovid||""} onChange={f("milPovid")}/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setEditId(null)}>Скасувати</button>
              <button className="btn btn-primary" onClick={saveEdit} disabled={saving}>{saving?"Збереження…":"Зберегти"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}




// ═══ TCK NOTICES PAGE ═══════════════════════════════════════════════════════
function TckNotices({employees, orders, notices, setNotices, showToast}) {
  const YEARS = [2021,2022,2023,2024,2025,2026];
  const curYear = new Date().getFullYear();
  const [activeYear, setActiveYear] = React.useState(curYear);
  const [modal, setModal] = React.useState(false);
  const [viewNotice, setViewNotice] = React.useState(null);
  const [editNotice, setEditNotice] = React.useState(null);
  const [form, setForm] = React.useState({});
  const [saving, setSaving] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const fileRef = React.useRef();
  const editFileRef = React.useRef();

  const getYear = n => n.year || (n.notice_date ? new Date(n.notice_date).getFullYear() : 0);
  const yearNotices = notices.filter(n => getYear(n) === activeYear)
    .sort((a,b) => (b.noticeDate||'').localeCompare(a.noticeDate||''));

  const STATUS_LABELS = {
    pending: {label:'Очікує відправки', color:'#856404', bg:'#fff3cd'},
    sent: {label:'Відправлено', color:'#0c5460', bg:'#d1ecf1'},
    delivered: {label:'Вручено / Отримано', color:'#155724', bg:'#d4edda'},
  };

  const TYPE_LABELS = {
    hire: 'Прийняття на роботу',
    fire: 'Звільнення',
    transfer: 'Переведення',
    change: 'Зміна облікових даних',
  };

  const empName = id => {
    const e = employees.find(e => e.id === id);
    return e ? e.lastName+' '+e.firstName+' '+(e.patronymic||'') : '—';
  };

  const uploadFile = async (file, noticeId) => {
    if (!file) return null;
    setUploading(true);
    try {
      const ext = file.name.split('.').pop();
      const path = 'tck_'+noticeId+'.'+ext;
      const r = await fetch(
        SUPABASE_URL+'/storage/v1/object/orders-files/'+path,
        {method:'POST', headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':file.type}, body:file}
      );
      if (!r.ok) throw new Error(await r.text());
      return {url: SUPABASE_URL+'/storage/v1/object/public/orders-files/'+path, name: file.name};
    } catch(err) {
      showToast('Помилка файлу: '+err.message, 'error');
      return null;
    } finally { setUploading(false); }
  };

  const save = async () => {
    if (!form.employeeId || !form.noticeDate || !form.noticeType) return alert('Заповніть обов\'язкові поля');
    setSaving(true);
    try {
      const id = uid();
      let fileUrl = null, fileName = null;
      if (fileRef.current && fileRef.current.files[0]) {
        const res = await uploadFile(fileRef.current.files[0], id);
        if (res) { fileUrl = res.url; fileName = res.name; }
      }
      const y = new Date(form.noticeDate).getFullYear();
      const payload = {
        id,
        employee_id: form.employeeId,
        order_id: form.orderId || null,
        notice_type: form.noticeType,
        notice_date: form.noticeDate,
        sent_date: form.sentDate || null,
        sent_method: form.sentMethod || null,
        tracking_num: form.trackingNum || null,
        received_by: form.receivedBy || null,
        received_date: form.receivedDate || null,
        file_url: fileUrl,
        file_name: fileName,
        notes: form.notes || null,
        status: form.status || 'pending',
        year: y,
      };
      await sbInsert('tck_notices', payload);
      setNotices(prev => [{...form, id, year:y, fileUrl, fileName, noticeDate:form.noticeDate},...prev]);
      showToast('Запис додано');
      setModal(false);
    } catch(err) { showToast('Помилка: '+err.message, 'error'); }
    setSaving(false);
  };

  const saveEdit = async () => {
    if (!editForm.employeeId || !editForm.noticeDate) return alert('Заповніть обов\'язкові поля');
    setSaving(true);
    try {
      let fileUrl = editNotice.fileUrl, fileName = editNotice.fileName;
      if (editFileRef.current && editFileRef.current.files[0]) {
        const res = await uploadFile(editFileRef.current.files[0], editNotice.id);
        if (res) { fileUrl = res.url; fileName = res.name; }
      }
      const payload = {
        employee_id: editForm.employeeId,
        order_id: editForm.orderId || null,
        notice_type: editForm.noticeType,
        notice_date: editForm.noticeDate,
        sent_date: editForm.sentDate || null,
        sent_method: editForm.sentMethod || null,
        tracking_num: editForm.trackingNum || null,
        received_by: editForm.receivedBy || null,
        received_date: editForm.receivedDate || null,
        file_url: fileUrl,
        file_name: fileName,
        notes: editForm.notes || null,
        status: editForm.status || 'pending',
        year: new Date(editForm.noticeDate).getFullYear(),
      };
      await sbUpdate('tck_notices', editNotice.id, payload);
      setNotices(prev => prev.map(n => n.id===editNotice.id ? {...n,...editForm,fileUrl,fileName} : n));
      showToast('Збережено');
      setEditNotice(null);
      setViewNotice(null);
    } catch(err) { showToast('Помилка: '+err.message, 'error'); }
    setSaving(false);
  };

  const remove = async id => {
    if (!confirm('Видалити запис?')) return;
    try {
      await sbDelete('tck_notices', id);
      setNotices(prev => prev.filter(n => n.id !== id));
      showToast('Видалено');
    } catch(err) { showToast('Помилка: '+err.message, 'error'); }
  };

  const f = k => v => setForm(p => ({...p, [k]: v.target?.value ?? v}));
  const ef = k => v => setEditNotice(p => ({...p, [k]: v.target?.value ?? v}));

  const stats = {
    total: yearNotices.length,
    pending: yearNotices.filter(n=>n.status==='pending').length,
    sent: yearNotices.filter(n=>n.status==='sent').length,
    delivered: yearNotices.filter(n=>n.status==='delivered').length,
  };

  const empOrders = (empId) => orders.filter(o => {
    if (!empId) return false;
    const ids = (o.employeeIds&&o.employeeIds.length>0)?o.employeeIds:(o.employeeId?[o.employeeId]:[]);
    return ids.includes(empId) && ['hire','fire','transfer'].includes(o.type);
  });

  const exportExcel = () => {
    const thS = 'background:#2d6a2d;color:#fff;border:1px solid #999;padding:5px 6px;font-size:8pt;text-align:center';
    const heads = ['N','Дата повідомлення','Працівник','Тип події','ТЦК','Статус','Спосіб відправки','Трек/номер','Ким отримано','Дата отримання','Примітки'];
    const hRow = heads.map(h=>'<th style="'+thS+'">'+h+'</th>').join('');
    const dRows = yearNotices.map((n,i)=>{
      const st = STATUS_LABELS[n.status]||{label:n.status||''};
      const emp = employees.find(e=>e.id===n.employeeId);
      const nm = emp?emp.lastName+' '+emp.firstName:'—';
      const tck = emp?(emp.milTck||'—'):'—';
      return '<tr><td>'+(i+1)+'</td><td>'+fmt(n.noticeDate)+'</td><td>'+nm+'</td><td>'+(TYPE_LABELS[n.noticeType]||'—')+'</td><td>'+tck+'</td><td>'+st.label+'</td><td>'+(n.sentMethod||'—')+'</td><td>'+(n.trackingNum||'—')+'</td><td>'+(n.receivedBy||'—')+'</td><td>'+fmt(n.receivedDate)+'</td><td>'+(n.notes||'—')+'</td></tr>';
    }).join('');
    const xls = '<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 6px;font-size:9pt}</style></head><body><h3>Реєстр повідомлень ТЦК '+activeYear+' — ФГ БЕНЕФІТ-АГРО</h3><table><tr>'+hRow+'</tr>'+dRows+'</table><p>Голова ФГ «БЕНЕФІТ-АГРО» ________________ Михайло ЛОБОЦЬКИЙ</p></body></html>';
    const blob = new Blob(['\uFEFF'+xls], {type:'application/vnd.ms-excel;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Реєстр_ТЦК_'+activeYear+'.xls';
    a.click();
    showToast('Реєстр завантажено');
  };

  const NoticeForm = ({data, setData, isEdit}) => {
    const fd = k => v => setData(p => ({...p, [k]: v.target?.value ?? v}));
    const relOrders = empOrders(data.employeeId);
    return (
      <div className="form-grid">
        <div className="form-group span2">
          <label>Працівник *</label>
          <select value={data.employeeId||''} onChange={fd('employeeId')}>
            <option value="">— оберіть —</option>
            {employees.filter(e=>e.status!=='fired').map(e=>(
              <option key={e.id} value={e.id}>{e.lastName} {e.firstName} {e.patronymic||''}</option>
            ))}
          </select>
        </div>
        <div className="form-group">
          <label>Тип події *</label>
          <select value={data.noticeType||'hire'} onChange={fd('noticeType')}>
            {Object.entries(TYPE_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label>Дата повідомлення *</label>
          <input type="date" value={data.noticeDate||''} onChange={fd('noticeDate')}/>
        </div>
        <div className="form-group span2">
          <label>Наказ (якщо є)</label>
          <select value={data.orderId||''} onChange={fd('orderId')}>
            <option value="">— без наказу —</option>
            {relOrders.map(o=>{
              const dp=(o.date||'').split('-');
              const od=dp.length===3?dp[2]+'.'+dp[1]+'.'+dp[0]:o.date||'';
              return <option key={o.id} value={o.id}>{'N'+o.number+' від '+od}</option>;
            })}
          </select>
        </div>
        <div className="form-section-title">Відправлення</div>
        <div className="form-group">
          <label>Статус</label>
          <select value={data.status||'pending'} onChange={fd('status')}>
            <option value="pending">Очікує відправки</option>
            <option value="sent">Відправлено</option>
            <option value="delivered">Вручено / Отримано</option>
          </select>
        </div>
        <div className="form-group">
          <label>Спосіб відправки</label>
          <select value={data.sentMethod||''} onChange={fd('sentMethod')}>
            <option value="">— оберіть —</option>
            <option value="Особисто (підпис на копії)">Особисто (підпис на копії)</option>
            <option value="Укрпошта (рекомендований лист)">Укрпошта (рекомендований лист)</option>
            <option value="Нова Пошта">Нова Пошта</option>
            <option value="Електронна пошта">Електронна пошта</option>
            <option value="Кабінет електронних послуг">Кабінет електронних послуг</option>
          </select>
        </div>
        {data.sentMethod && <>
          <div className="form-group">
            <label>Дата відправки</label>
            <input type="date" value={data.sentDate||''} onChange={fd('sentDate')}/>
          </div>
          <div className="form-group">
            <label>Трек-номер / ЕН</label>
            <input value={data.trackingNum||''} onChange={fd('trackingNum')} placeholder="Номер відправлення"/>
          </div>
          <div className="form-group">
            <label>Ким отримано (ПІБ)</label>
            <input value={data.receivedBy||''} onChange={fd('receivedBy')} placeholder="ПІБ отримувача"/>
          </div>
          <div className="form-group">
            <label>Дата отримання</label>
            <input type="date" value={data.receivedDate||''} onChange={fd('receivedDate')}/>
          </div>
        </>}
        <div className="form-group span2">
          <label>Примітки</label>
          <textarea value={data.notes||''} onChange={fd('notes')} placeholder="Додаткова інформація..."/>
        </div>
        <div className="form-group span2">
          <label>📎 {isEdit && data.fileUrl ? 'Замінити скан доказу' : 'Скан доказу (квитанція, підпис на копії)'}</label>
          {isEdit && data.fileUrl && (
            <div style={{fontSize:12,color:'var(--green)',marginBottom:6,padding:'5px 8px',background:'#e8f5e8',borderRadius:5}}>
              ✅ {data.fileName||'файл'} <a href={data.fileUrl} target="_blank" rel="noreferrer" style={{marginLeft:8,color:'var(--blue)'}}>переглянути</a>
            </div>
          )}
          <input type="file" ref={isEdit ? editFileRef : fileRef} accept=".pdf,.jpg,.jpeg,.png,.webp" style={{fontSize:12}}/>
          <div style={{fontSize:11,color:'#8aaa8a',marginTop:3}}>PDF, JPG, PNG — квитанція пошти, підпис на копії тощо</div>
        </div>
      </div>
    );
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-title">📨 Реєстр повідомлень до ТЦК</div>
        <div className="page-sub">Додаток 4, п.34 Порядку №1487 — строк подачі 7 днів з дня наказу</div>
      </div>

      <TckAlertPanel orders={orders} employees={employees} notices={notices||[]} showToast={showToast}/>

      <div className="stats-row" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card"><div className="stat-num">{stats.total}</div><div className="stat-label">📋 Всього у {activeYear}</div></div>
        <div className="stat-card red"><div className="stat-num" style={{color:'var(--red)'}}>{stats.pending}</div><div className="stat-label">⏳ Очікують відправки</div></div>
        <div className="stat-card blue"><div className="stat-num" style={{color:'#0c5460'}}>{stats.sent}</div><div className="stat-label">📮 Відправлено</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--green)'}}>{stats.delivered}</div><div className="stat-label">✅ Вручено / Отримано</div></div>
      </div>

      <div className="card">
        <div style={{padding:'0 16px',background:'var(--dark)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex'}}>
            {YEARS.map(y=>{
              const cnt = notices.filter(n=>getYear(n)===y).length;
              return (
                <div key={y} onClick={()=>setActiveYear(y)}
                  style={{padding:'11px 15px',cursor:'pointer',fontSize:12,fontWeight:600,
                    color:activeYear===y?'var(--gold)':'#8aac8a',
                    borderBottom:activeYear===y?'2px solid var(--gold)':'2px solid transparent'}}>
                  {y}{cnt>0&&<span style={{marginLeft:4,background:activeYear===y?'var(--gold)':'#3d5c3d',color:activeYear===y?'var(--dark)':'#adc9ad',borderRadius:10,padding:'1px 5px',fontSize:10}}>{cnt}</span>}
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-gold btn-sm" onClick={exportExcel}>⬇️ Excel</button>
            <button className="btn btn-sm" style={{background:'var(--green2)',color:'#fff'}} onClick={()=>{setForm({noticeDate:today(),noticeType:'hire',status:'pending'});setModal(true);}}>+ Новий запис</button>
          </div>
        </div>

        <div style={{overflowX:'auto'}}>
          <table>
            <thead>
              <tr>
                <th style={{width:95}}>Дата</th>
                <th>Працівник</th>
                <th>Тип події</th>
                <th>ТЦК</th>
                <th>Спосіб / Трек</th>
                <th style={{width:120}}>Статус</th>
                <th style={{width:46}}>📎</th>
                <th style={{width:80}}></th>
              </tr>
            </thead>
            <tbody>
              {yearNotices.length===0 && (
                <tr><td colSpan={8}><div className="empty"><div className="empty-icon">📨</div>Повідомлень за {activeYear} рік немає</div></td></tr>
              )}
              {yearNotices.map(n=>{
                const emp = employees.find(e=>e.id===n.employeeId);
                const nm = emp?emp.lastName+' '+emp.firstName:'—';
                const tck = emp?(emp.milTck||'—'):'—';
                const st = STATUS_LABELS[n.status]||{label:n.status,color:'#333',bg:'#eee'};
                return (
                  <tr key={n.id} style={{cursor:'pointer'}} onClick={()=>setViewNotice(n)}>
                    <td style={{whiteSpace:'nowrap'}}>{fmt(n.noticeDate)}</td>
                    <td style={{fontWeight:500}}>{nm}</td>
                    <td><span className="badge badge-active" style={{fontSize:11}}>{TYPE_LABELS[n.noticeType]||n.noticeType}</span></td>
                    <td style={{fontSize:11,color:'#4a6a4a'}}>{tck.length>30?tck.substring(0,30)+'…':tck}</td>
                    <td style={{fontSize:11}}>
                      {n.sentMethod&&<div>{n.sentMethod}</div>}
                      {n.trackingNum&&<div style={{color:'var(--blue)',fontWeight:600}}>{n.trackingNum}</div>}
                    </td>
                    <td>
                      <span style={{display:'inline-block',padding:'3px 8px',borderRadius:20,fontSize:11,fontWeight:600,background:st.bg,color:st.color}}>{st.label}</span>
                    </td>
                    <td style={{textAlign:'center'}}>
                      {n.fileUrl
                        ?<span style={{fontSize:17,cursor:'pointer'}} onClick={e=>{e.stopPropagation();window.open(n.fileUrl,'_blank');}}>📎</span>
                        :<span style={{color:'#ddd'}}>—</span>
                      }
                    </td>

// ── helpers ──────────────────────────────────────────────────────────────────

// ═══ VACATION HELPERS (based on orders analysis) ════════════════════════════

// Get hire date for employee from orders (most recent hire order)
function getHireDateFromOrders(empId, orders) {
  const hireOrders = orders
    .filter(o => o.type === 'hire' && (
      (o.employeeIds && o.employeeIds.includes(empId)) ||
      o.employeeId === empId
    ))
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if (hireOrders.length > 0) return hireOrders[0].date;
  return null;
}

// Get fire date for employee from orders (most recent fire order)
function getFireDateFromOrders(empId, orders) {
  const fireOrders = orders
    .filter(o => o.type === 'fire' && (
      (o.employeeIds && o.employeeIds.includes(empId)) ||
      o.employeeId === empId
    ))
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (fireOrders.length > 0) return fireOrders[0].date;
  return null;
}

// Calculate work years from hire date to given date (default: today)
function calcWorkYears(hireDate, toDate) {
  if (!hireDate) return 0;
  const hire = new Date(hireDate);
  const to = toDate ? new Date(toDate) : new Date();
  if (isNaN(hire.getTime()) || hire > to) return 0;
  const ms = to - hire;
  return ms / (1000 * 60 * 60 * 24 * 365.25);
}

// Calculate days entitled for a specific year based on hire date
// Logic: proportional entitlement in first and last year, full 24 in complete years
function calcEntitledDaysForYear(hireDate, year, baseAnnual, fireDate) {
  const base = baseAnnual || 24;
  if (!hireDate) return 0;

  const hire = new Date(hireDate);
  const hireYear = hire.getFullYear();
  const yearStart = new Date(year, 0, 1);   // Jan 1
  const yearEnd = new Date(year, 11, 31);   // Dec 31

  // Employee not yet hired this year
  if (hire > yearEnd) return 0;

  // Employee was fired before this year started
  if (fireDate) {
    const fire = new Date(fireDate);
    if (fire < yearStart) return 0;
  }

  // Full years of service (for extra days calculation)
  const yearsAtYearEnd = calcWorkYears(hireDate, yearEnd.toISOString().slice(0,10));
  let entitledFull = base;
  if (yearsAtYearEnd >= 15) entitledFull = base + 4;
  else if (yearsAtYearEnd >= 10) entitledFull = base + 2;

  // First year of work: proportional (from hire date to end of year)
  if (hireYear === year) {
    const workStart = hire;
    const workEnd = fireDate && new Date(fireDate) < yearEnd ? new Date(fireDate) : yearEnd;
    const daysWorked = Math.round((workEnd - workStart) / 86400000) + 1;
    const daysInYear = (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 366 : 365;
    return Math.round((daysWorked / daysInYear) * entitledFull);
  }

  // Year of firing: proportional (from Jan 1 to fire date)
  if (fireDate) {
    const fire = new Date(fireDate);
    if (fire.getFullYear() === year) {
      const daysWorked = Math.round((fire - yearStart) / 86400000) + 1;
      const daysInYear = (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 366 : 365;
      return Math.round((daysWorked / daysInYear) * entitledFull);
    }
  }

  // Full year: return full entitlement
  return entitledFull;
}

// For backward compat - entitled for current year
function calcEntitledDays(hireDate, baseAnnual) {
  return calcEntitledDaysForYear(hireDate, new Date().getFullYear(), baseAnnual, null);
}

// Calculate used vacation days from leaves records
function calcUsedDays(empId, year, leaves) {
  return leaves
    .filter(l => l.employeeId === empId && l.type === 'vacation')
    .filter(l => {
      const leaveYear = l.dateStart ? new Date(l.dateStart).getFullYear() : 0;
      return leaveYear === year;
    })
    .reduce((sum, l) => {
      if (!l.dateStart || !l.dateEnd) return sum;
      const days = Math.round((new Date(l.dateEnd) - new Date(l.dateStart)) / 86400000) + 1;
      return sum + days;
    }, 0);
}

// Calculate compensation on firing
function calcCompensation(hireDate, fireDate, annualDays) {
  if (!hireDate || !fireDate) return {months:0, days:0, unusedDays:0};
  const hire = new Date(hireDate);
  const fire = new Date(fireDate);
  const msPerDay = 86400000;
  const totalDays = Math.round((fire - hire) / msPerDay);
  const months = totalDays / 30.44;
  const daysPerMonth = (annualDays || 24) / 12;
  const earned = months * daysPerMonth;
  return {
    months: Math.round(months * 10)/10,
    days: Math.round(earned * 10)/10,
    unusedDays: Math.round(earned * 10)/10
  };
}

// Get full vacation summary for employee using orders data
function getVacationSummary(emp, year, leaves, orders, balances) {
  // Get hire date: from orders first, fallback to employee record
  const hireDateFromOrders = getHireDateFromOrders(emp.id, orders);
  const hireDate = hireDateFromOrders || emp.hireDate;

  // Get fire date if fired
  const fireDateFromOrders = emp.status === 'fired' ? getFireDateFromOrders(emp.id, orders) : null;

  // Not yet working in this year
  if (!hireDate) return {entitled:0, used:0, remaining:0, carried:0, hireDate:null, hireYear:null, warning:null};

  const hireYear = new Date(hireDate).getFullYear();
  if (hireYear > year) return {entitled:0, used:0, remaining:0, carried:0, hireDate, hireYear, warning:'Ще не працював'};

  // Fired before this year
  if (fireDateFromOrders && new Date(fireDateFromOrders).getFullYear() < year) {
    return {entitled:0, used:0, remaining:0, carried:0, hireDate, hireYear, warning:'Звільнений'};
  }

  const entitled = calcEntitledDaysForYear(hireDate, year, emp.annualVacationDays || 24, fireDateFromOrders);
  const used = calcUsedDays(emp.id, year, leaves);
  const bal = balances ? balances.find(b => b.employeeId === emp.id && b.year === year) : null;
  const carried = bal ? (bal.daysCarried || 0) : 0;
  const remaining = entitled + carried - used;

  let warning = null;
  if (remaining < 0) warning = 'Перевищення!';
  else if (remaining <= 3 && hireYear <= year) warning = 'Критично мало';
  else if (remaining <= 7) warning = 'Мало';

  return {entitled, used, remaining, carried, hireDate, hireYear,
          fireDate: fireDateFromOrders, warning, workYears: calcWorkYears(hireDate)};
}


// ── VACATION BALANCE CARD ────────────────────────────────────────────────────
function VacationBalanceCard({emp, leaves, balances, orders, year}) {
  const summary = getVacationSummary(emp, year, leaves, orders, balances);
  const {entitled, used, remaining, carried, hireDate, hireYear, warning, workYears} = summary;
  const pct = Math.max(0, Math.min(100, entitled+carried>0?(used/(entitled+carried))*100:0));

  if (summary.warning === 'Звільнений' || summary.warning === 'Ще не працював') return null;

  return (
    <div style={{background:'#fff',borderRadius:8,padding:'14px 16px',border:'1px solid var(--light)',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
        <div>
          <div style={{fontWeight:700,fontSize:13}}>{emp.lastName} {emp.firstName[0]}.{(emp.patronymic||'')[0]}.</div>
          <div style={{fontSize:11,color:'#6a8a6a'}}>{emp.position||''}</div>
          <div style={{fontSize:10,color:'#9aaa9a',marginTop:2}}>
            {hireDate ? 'Прийнятий: '+fmt(hireDate) : 'Дата прийому невідома'}
            {workYears > 0 ? ' · Стаж: '+Math.floor(workYears)+' р. '+Math.floor((workYears%1)*12)+' міс.' : ''}
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:22,fontWeight:700,color:remaining<0?'var(--red)':remaining<=3?'var(--red)':remaining<=7?'#856404':'var(--green)'}}>{remaining}</div>
          <div style={{fontSize:10,color:'#6a8a6a'}}>залишок днів</div>
          {warning && <div style={{fontSize:10,color:'var(--red)',fontWeight:600}}>⚠️ {warning}</div>}
        </div>
      </div>
      <div style={{background:'#f0f4f0',borderRadius:4,height:6,marginBottom:8,overflow:'hidden'}}>
        <div style={{height:'100%',borderRadius:4,background:remaining<5?'var(--red)':remaining<10?'var(--gold)':'var(--green)',width:pct+'%',transition:'width .3s'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#6a8a6a'}}>
        <span>Належить: <strong>{entitled}</strong>{carried>0&&<span style={{color:'var(--green)'}}>+{carried}</span>} дн.</span>
        <span>Використано: <strong>{used}</strong> дн.</span>
        {remaining<0&&<span style={{color:'var(--red)',fontWeight:700}}>⚠️ Перевищення!</span>}
      </div>
    </div>
  );
}

// ═══ UKRAINIAN NAME DECLENSION ═══════════════════════════════════════════════
// Відмінювання ПІБ у родовий та давальний відмінки

function declineLastName(word, gender) {
  // gender: 'm' - чоловічий, 'f' - жіночий
  if (!word) return word;
  const w = word.trim();
  const low = w.toLowerCase();

  // Незмінні прізвища (на -о, -е, -і, -и, -у)
  if (/[оеіиу]$/i.test(w) && !/ськ[ий|ій]/i.test(w)) return w;

  if (gender === 'm') {
    // Чоловічі прізвища
    if (/ський$/i.test(w)) return w.slice(0,-2) + 'ого';
    if (/зький$/i.test(w)) return w.slice(0,-2) + 'ого';
    if (/цький$/i.test(w)) return w.slice(0,-2) + 'ого';
    if (/ний$/i.test(w))   return w.slice(0,-2) + 'ого';
    if (/дній$/i.test(w))  return w.slice(0,-2) + 'ого';
    if (/жній$/i.test(w))  return w.slice(0,-2) + 'ого';
    if (/ій$/i.test(w))    return w.slice(0,-2) + 'ого';
    if (/ій$/i.test(w))    return w.slice(0,-2) + 'ого';
    if (/ов$/i.test(w))    return w + 'а';
    if (/єв$/i.test(w))    return w + 'а';
    if (/ів$/i.test(w))    return w.slice(0,-2) + 'ева';
    if (/ев$/i.test(w))    return w + 'а';
    if (/ин$/i.test(w))    return w + 'а';
    if (/ець$/i.test(w))   return w.slice(0,-3) + 'ця';
    if (/ець$/i.test(w))   return w.slice(0,-3) + 'ця';
    if (/ко$/i.test(w))    return w;  // Незмінне
    if (/ло$/i.test(w))    return w;
    if (/но$/i.test(w))    return w;
    // Загальне правило для чол. на приголосний
    const lastChar = w.slice(-1).toLowerCase();
    if ('бвгджзйклмнпрстфхцчшщ'.includes(lastChar)) return w + 'а';
    return w;
  } else {
    // Жіночі прізвища
    if (/ська$/i.test(w))  return w.slice(0,-2) + 'ої';
    if (/зька$/i.test(w))  return w.slice(0,-2) + 'ої';
    if (/цька$/i.test(w))  return w.slice(0,-2) + 'ої';
    if (/на$/i.test(w))    return w.slice(0,-1) + 'ої';
    if (/ва$/i.test(w))    return w.slice(0,-1) + 'ої';
    if (/ка$/i.test(w))    return w.slice(0,-1) + 'ої';
    if (/ова$/i.test(w))   return w.slice(0,-1) + 'ої';
    if (/єва$/i.test(w))   return w.slice(0,-1) + 'ої';
    if (/іна$/i.test(w))   return w.slice(0,-1) + 'ої';
    if (/а$/i.test(w))     return w.slice(0,-1) + 'ої';
    // Незмінні жіночі на приголосний
    return w;
  }
}

function declineFirstName(word, gender) {
  if (!word) return word;
  const w = word.trim();

  if (gender === 'm') {
    if (/ій$/i.test(w))    return w.slice(0,-2) + 'ого';    // Андрій -> Андрія... 
    if (/ій$/i.test(w))    return w.slice(0,-2) + 'ого';
    if (/о$/i.test(w))     return w;  // Незмінне
    if (/а$/i.test(w))     return w.slice(0,-1) + 'и';      // Микола -> Миколи
    if (/ло$/i.test(w))    return w;
    // Чоловічі імена на приголосний -> +а
    const lastChar = w.slice(-1).toLowerCase();
    if ('бвгджзйклмнпрстфхцчшщ'.includes(lastChar)) return w + 'а';
    return w;
  } else {
    if (/ія$/i.test(w))    return w.slice(0,-1) + 'ї';      // Марія -> Марії
    if (/ія$/i.test(w))    return w.slice(0,-1) + 'ї';
    if (/іна$/i.test(w))   return w.slice(0,-1) + 'ни';     // Катерина -> Катерини
    if (/на$/i.test(w))    return w.slice(0,-1) + 'ни';
    if (/а$/i.test(w))     return w.slice(0,-1) + 'и';
    if (/я$/i.test(w))     return w.slice(0,-1) + 'і';
    return w;
  }
}

function declinePatronymic(word, gender) {
  if (!word) return word;
  const w = word.trim();

  if (gender === 'm') {
    if (/ович$/i.test(w))  return w.slice(0,-3) + 'овича';  // Васильович -> Васильовича
    if (/йович$/i.test(w)) return w.slice(0,-3) + 'овича';
    if (/євич$/i.test(w))  return w.slice(0,-3) + 'євича';
    if (/іович$/i.test(w)) return w.slice(0,-3) + 'іовича';
    if (/ич$/i.test(w))    return w + 'а';
    return w;
  } else {
    if (/івна$/i.test(w))  return w.slice(0,-2) + 'ни';     // Василівна -> Василівни
    if (/овна$/i.test(w))  return w.slice(0,-2) + 'ни';     // Миколаївна -> Миколаївни
    if (/євна$/i.test(w))  return w.slice(0,-2) + 'ни';
    if (/на$/i.test(w))    return w.slice(0,-1) + 'ни';
    return w;
  }
}

// Визначити стать по імені та по батькові
function detectGender(firstName, patronymic) {
  if (patronymic) {
    if (/ович$/i.test(patronymic) || /йович$/i.test(patronymic) || /євич$/i.test(patronymic)) return 'm';
    if (/івна$/i.test(patronymic) || /овна$/i.test(patronymic) || /євна$/i.test(patronymic)) return 'f';
  }
  if (firstName) {
    // Чоловічі закінчення імен
    if (/ій$/i.test(firstName) || /ло$/i.test(firstName) || /ро$/i.test(firstName)) return 'm';
    if (/ла$/i.test(firstName) || /ля$/i.test(firstName)) return 'm'; // Микола, Іля
    // Жіночі
    if (/ія$/i.test(firstName) || /іна$/i.test(firstName) || /ина$/i.test(firstName)) return 'f';
    if (/на$/i.test(firstName) || /ра$/i.test(firstName)) return 'f';
    // За закінченням
    if (/[аяіє]$/i.test(firstName)) {
      // Може бути і чоловіче (Микола, Ілля)
      if (/ла$/i.test(firstName) || /ля$/i.test(firstName)) return 'm';
      return 'f';
    }
  }
  return 'm'; // За замовчуванням чоловічий
}

// Головна функція: отримати ПІБ у родовому відмінку
function getFullNameGenitive(lastName, firstName, patronymic) {
  const gender = detectGender(firstName, patronymic);
  const ln = declineLastName(lastName, gender);
  const fn = declineFirstName(firstName, gender);
  const pn = declinePatronymic(patronymic, gender);
  return ln + ' ' + fn + ' ' + pn;
}

// Давальний відмінок (для "надати КОМУ")
function declineLastNameDative(word, gender) {
  if (!word) return word;
  const w = word.trim();
  if (gender === 'm') {
    if (/ський$/i.test(w)) return w.slice(0,-2) + 'ому';
    if (/зький$/i.test(w)) return w.slice(0,-2) + 'ому';
    if (/цький$/i.test(w)) return w.slice(0,-2) + 'ому';
    if (/ній$/i.test(w))   return w.slice(0,-2) + 'ому';
    if (/ій$/i.test(w))    return w.slice(0,-2) + 'ому';
    if (/ов$/i.test(w))    return w + 'у';
    if (/єв$/i.test(w))    return w + 'у';
    if (/ев$/i.test(w))    return w + 'у';
    if (/ин$/i.test(w))    return w + 'у';
    if (/ець$/i.test(w))   return w.slice(0,-3) + 'цю';
    if (/ко$/i.test(w))    return w;
    if (/ло$/i.test(w))    return w;
    const lc = w.slice(-1).toLowerCase();
    if ('бвгджзйклмнпрстфхцчшщ'.includes(lc)) return w + 'у';
    return w;
  } else {
    if (/ська$/i.test(w))  return w.slice(0,-2) + 'ій';
    if (/зька$/i.test(w))  return w.slice(0,-2) + 'ій';
    if (/цька$/i.test(w))  return w.slice(0,-2) + 'ій';
    if (/а$/i.test(w))     return w.slice(0,-1) + 'ій';
    return w;
  }
}

function declineFirstNameDative(word, gender) {
  if (!word) return word;
  const w = word.trim();
  if (gender === 'm') {
    if (/ій$/i.test(w))  return w.slice(0,-2) + 'ому';  // Андрій -> Андрію
    if (/а$/i.test(w))   return w.slice(0,-1) + 'і';    // Микола -> Миколі
    const lc = w.slice(-1).toLowerCase();
    if ('бвгджзйклмнпрстфхцчшщ'.includes(lc)) return w + 'у';
    return w;
  } else {
    if (/ія$/i.test(w))  return w.slice(0,-1) + 'ї';    // Марія -> Марії
    if (/іна$/i.test(w)) return w.slice(0,-1) + 'ні';   // Катерина -> Катерині
    if (/на$/i.test(w))  return w.slice(0,-1) + 'ні';
    if (/а$/i.test(w))   return w.slice(0,-1) + 'і';
    if (/я$/i.test(w))   return w.slice(0,-1) + 'і';
    return w;
  }
}

function declinePatronymicDative(word, gender) {
  if (!word) return word;
  const w = word.trim();
  if (gender === 'm') {
    if (/ович$/i.test(w))  return w.slice(0,-3) + 'овичу';
    if (/євич$/i.test(w))  return w.slice(0,-3) + 'євичу';
    if (/ич$/i.test(w))    return w + 'у';
    return w;
  } else {
    if (/івна$/i.test(w))  return w.slice(0,-2) + 'ні';
    if (/овна$/i.test(w))  return w.slice(0,-2) + 'ні';
    if (/євна$/i.test(w))  return w.slice(0,-2) + 'ні';
    if (/на$/i.test(w))    return w.slice(0,-1) + 'ні';
    return w;
  }
}

function getFullNameDative(lastName, firstName, patronymic) {
  const gender = detectGender(firstName, patronymic);
  const ln = declineLastNameDative(lastName, gender);
  const fn = declineFirstNameDative(firstName, gender);
  const pn = declinePatronymicDative(patronymic, gender);
  return ln + ' ' + fn + ' ' + pn;
}

  const dlFile = (content, filename, enc) => {
    let bytes;
    if (enc === 'cp1251') {
      // Convert to Windows-1251
      const arr = [];
      for (let i = 0; i < content.length; i++) {
        const code = content.charCodeAt(i);
        if (code < 128) { arr.push(code); continue; }
        // Ukrainian cp1251 mapping
        const map = {'Є':170,'Ї':175,'І':178,'і':179,'є':186,'ї':191,'А':192,'Б':193,'В':194,'Г':195,'Д':196,'Е':197,'Ж':198,'З':199,'И':200,'Й':201,'К':202,'Л':203,'М':204,'Н':205,'О':206,'П':207,'Р':208,'С':209,'Т':210,'У':211,'Ф':212,'Х':213,'Ц':214,'Ч':215,'Ш':216,'Щ':217,'Ъ':218,'Ы':219,'Ь':220,'Э':221,'Ю':222,'Я':223,'а':224,'б':225,'в':226,'г':227,'д':228,'е':229,'ж':230,'з':231,'и':232,'й':233,'к':234,'л':235,'м':236,'н':237,'о':238,'п':239,'р':240,'с':241,'т':242,'у':243,'ф':244,'х':245,'ц':246,'ч':247,'ш':248,'щ':249,'ъ':250,'ы':251,'ь':252,'э':253,'ю':254,'я':255,'"':34,"'":39};
        arr.push(map[content[i]] || 63);
      }
      bytes = new Uint8Array(arr);
    } else {
      bytes = new TextEncoder().encode(content);
    }
    const blob = new Blob([bytes], {type:'application/xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  };

    if (!hasSalaries) return alert('Введіть суми зарплат');
